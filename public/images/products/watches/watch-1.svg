<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e17"/>
      <stop offset="50%" stop-color="#141224"/>
      <stop offset="100%" stop-color="#08070d"/>
    </linearGradient>
    <linearGradient id="purpleDial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="neon3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad3)"/>
  <circle cx="400" cy="300" r="170" fill="#7c3aed" opacity="0.16" filter="url(#neon3)"/>

  <!-- Straps -->
  <!-- Top Strap -->
  <path d="M 330 200 L 340 70 L 460 70 L 470 200 Z" fill="#181824" stroke="#2a283d" stroke-width="3"/>
  <line x1="400" y1="80" x2="400" y2="190" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Bottom Strap -->
  <path d="M 330 400 L 340 530 L 460 530 L 470 400 Z" fill="#181824" stroke="#2a283d" stroke-width="3"/>
  <line x1="400" y1="410" x2="400" y2="520" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Titanium Chassis Watch Case -->
  <circle cx="400" cy="300" r="130" fill="#12121b" stroke="#37344d" stroke-width="8"/>
  <circle cx="400" cy="300" r="120" fill="#09090e" stroke="#8b5cf6" stroke-width="3" filter="url(#neon3)"/>

  <!-- Digital Bezel Ticks -->
  <circle cx="400" cy="300" r="105" fill="none" stroke="#2d2a42" stroke-width="4" stroke-dasharray="4 14"/>

  <!-- AMOLED Screen Display -->
  <circle cx="400" cy="300" r="95" fill="#0b0914"/>

  <!-- Glowing UI Elements -->
  <!-- Chrono Ring -->
  <path d="M 400 215 A 85 85 0 1 1 330 350" fill="none" stroke="url(#purpleDial)" stroke-width="6" stroke-linecap="round" filter="url(#neon3)"/>
  
  <!-- Digital Clock text -->
  <text x="400" y="295" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">10:42</text>
  <text x="400" y="325" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#c084fc" text-anchor="middle" letter-spacing="4">NOVAPRO // 142 BPM</text>

  <!-- Crown Button -->
  <rect x="530" y="280" width="16" height="40" rx="5" fill="#2d2a42" stroke="#7c3aed" stroke-width="2"/>
</svg>
