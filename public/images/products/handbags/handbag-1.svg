<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e17"/>
      <stop offset="50%" stop-color="#141224"/>
      <stop offset="100%" stop-color="#08070d"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1b26"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <filter id="neon4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad4)"/>
  <circle cx="400" cy="350" r="160" fill="#8b5cf6" opacity="0.14" filter="url(#neon4)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="400" cy="495" rx="180" ry="18" fill="#000000" opacity="0.8"/>

  <!-- Crossbody Webbing Strap -->
  <path d="M 260 300 C 240 100 560 100 540 300" fill="none" stroke="#252238" stroke-width="22" stroke-linecap="round"/>
  <path d="M 260 300 C 240 100 560 100 540 300" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="14 10" filter="url(#neon4)"/>

  <!-- Bag Main Body -->
  <rect x="250" y="270" width="300" height="210" rx="36" fill="url(#bagGrad)" stroke="#322e4d" stroke-width="4"/>

  <!-- Flap -->
  <path d="M 250 270 L 550 270 L 550 360 C 550 385 530 405 505 405 L 295 405 C 270 405 250 385 250 360 Z" fill="#14131f" stroke="#3b375a" stroke-width="3"/>

  <!-- Anodized Magnetic Clasp -->
  <rect x="365" y="380" width="70" height="42" rx="12" fill="#0b0a12" stroke="#8b5cf6" stroke-width="3" filter="url(#neon4)"/>
  <circle cx="400" cy="401" r="6" fill="#c084fc" filter="url(#neon4)"/>

  <text x="400" y="335" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#a855f7" text-anchor="middle" letter-spacing="6">ECLIPSE // MATTE</text>
</svg>
