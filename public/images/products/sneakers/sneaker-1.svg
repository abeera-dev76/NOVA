<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e17"/>
      <stop offset="50%" stop-color="#141224"/>
      <stop offset="100%" stop-color="#08070d"/>
    </linearGradient>
    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="soleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle cyber grid lines -->
  <g opacity="0.15" stroke="#8b5cf6" stroke-width="1">
    <line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="0" y1="520" x2="800" y2="520"/>
    <line x1="100" y1="480" x2="200" y2="600"/>
    <line x1="300" y1="480" x2="350" y2="600"/>
    <line x1="500" y1="480" x2="450" y2="600"/>
    <line x1="700" y1="480" x2="600" y2="600"/>
  </g>

  <!-- Ambient light orb behind sneaker -->
  <circle cx="400" cy="310" r="180" fill="#8b5cf6" opacity="0.18" filter="url(#neonGlow)"/>

  <!-- Shadow below sneaker -->
  <ellipse cx="410" cy="470" rx="260" ry="22" fill="#000000" opacity="0.75" filter="url(#neonGlow)"/>
  <ellipse cx="400" cy="465" rx="190" ry="12" fill="#a855f7" opacity="0.25" filter="url(#neonGlow)"/>

  <!-- SNEAKER BODY -->
  <!-- Outsole / Midsole -->
  <path d="M 180 435 C 220 445 280 448 370 445 C 440 442 490 445 540 448 C 610 452 645 440 650 425 C 655 410 635 390 600 395 C 560 400 500 402 440 400 C 370 398 300 405 240 415 C 200 420 170 425 180 435 Z" fill="url(#soleGrad)" filter="url(#neonGlow)"/>
  
  <!-- Neon Midsole Cushion Strip -->
  <path d="M 210 432 C 280 438 380 436 460 433 C 530 430 590 434 635 422" stroke="url(#purpleNeon)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#neonGlow)"/>
  <path d="M 230 432 C 290 438 380 436 450 433" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Carbon Fiber Plate Section -->
  <path d="M 330 434 C 360 432 410 432 445 434 L 435 418 C 400 417 365 417 340 419 Z" fill="#181824" stroke="#8b5cf6" stroke-width="1.5"/>

  <!-- Upper Shoe Body -->
  <path d="M 240 415 C 210 395 240 330 270 280 C 290 250 330 240 370 245 C 390 250 420 280 460 310 C 510 345 570 370 615 385 C 635 390 645 405 625 418 C 585 410 520 402 440 400 C 360 398 290 405 240 415 Z" fill="#14141e" stroke="#2e2b44" stroke-width="3"/>

  <!-- Heel Collar & Counter -->
  <path d="M 265 290 C 250 250 280 215 315 220 C 335 222 345 245 350 270 C 320 275 290 280 265 290 Z" fill="#1e1b2e" stroke="#7c3aed" stroke-width="2"/>
  
  <!-- Heel Pull Tab with Purple Glow -->
  <path d="M 290 218 C 280 190 295 180 310 185 C 320 190 318 215 315 220" fill="none" stroke="url(#purpleNeon)" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Cyber Lacing & Eyestay -->
  <path d="M 355 255 L 435 315 L 495 345" fill="none" stroke="#2d2a45" stroke-width="12" stroke-linecap="round"/>
  <!-- Glowing Laces -->
  <line x1="365" y1="260" x2="395" y2="280" stroke="#c084fc" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>
  <line x1="390" y1="280" x2="425" y2="300" stroke="#c084fc" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>
  <line x1="420" y1="300" x2="460" y2="320" stroke="#c084fc" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>
  <line x1="455" y1="320" x2="500" y2="340" stroke="#c084fc" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Sleek Cyber Swoop / NOVA Wing Motif -->
  <path d="M 320 375 C 390 370 470 340 540 310 C 480 345 420 375 345 385 Z" fill="url(#purpleNeon)" filter="url(#neonGlow)"/>
  
  <!-- Toe Guard Texture Overlay -->
  <path d="M 580 375 C 610 385 635 395 625 418 C 595 412 560 405 535 400 C 550 385 565 378 580 375 Z" fill="#242138" opacity="0.8"/>

  <!-- Branding Badge -->
  <text x="310" y="340" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="16" fill="#a855f7" letter-spacing="4" opacity="0.9">NOVA // X1</text>
  <circle cx="295" cy="335" r="3" fill="#ffffff" filter="url(#neonGlow)"/>
</svg>
