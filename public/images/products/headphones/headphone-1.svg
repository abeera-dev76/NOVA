<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e17"/>
      <stop offset="50%" stop-color="#141224"/>
      <stop offset="100%" stop-color="#08070d"/>
    </linearGradient>
    <linearGradient id="purpleGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <filter id="neon2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad2)"/>
  <circle cx="400" cy="300" r="180" fill="#8b5cf6" opacity="0.15" filter="url(#neon2)"/>

  <!-- Headphone Stand Shadow -->
  <ellipse cx="400" cy="490" rx="160" ry="16" fill="#000000" opacity="0.8" filter="url(#neon2)"/>
  <ellipse cx="400" cy="485" rx="110" ry="8" fill="#8b5cf6" opacity="0.3" filter="url(#neon2)"/>

  <!-- Cushioned Headband Arc -->
  <path d="M 270 340 C 260 160 540 160 530 340" fill="none" stroke="#1c1b29" stroke-width="36" stroke-linecap="round"/>
  <path d="M 285 330 C 280 185 520 185 515 330" fill="none" stroke="#0a0a0f" stroke-width="26" stroke-linecap="round"/>
  <!-- Headband Outer Metallic Spine -->
  <path d="M 275 320 C 270 170 530 170 525 320" fill="none" stroke="url(#purpleGlow2)" stroke-width="6" stroke-linecap="round" filter="url(#neon2)"/>

  <!-- Left Ear Cup Assembly -->
  <g transform="translate(210, 290)">
    <!-- Yoke -->
    <path d="M 50 10 L 50 50 C 50 65 30 75 30 90" fill="none" stroke="#2e2b44" stroke-width="12" stroke-linecap="round"/>
    <!-- Outer Cup -->
    <ellipse cx="60" cy="90" rx="42" ry="68" fill="#14141e" stroke="#353150" stroke-width="3"/>
    <!-- LED Ambient Ring -->
    <ellipse cx="60" cy="90" rx="30" ry="52" fill="none" stroke="url(#purpleGlow2)" stroke-width="5" filter="url(#neon2)"/>
    <!-- Center Aluminum Disc -->
    <ellipse cx="60" cy="90" rx="20" ry="36" fill="#1e1b2e"/>
    <!-- Memory Foam Cushion -->
    <ellipse cx="80" cy="90" rx="18" ry="64" fill="#0b0b10" stroke="#1e1b2e" stroke-width="3"/>
  </g>

  <!-- Right Ear Cup Assembly -->
  <g transform="translate(480, 290)">
    <!-- Yoke -->
    <path d="M 50 10 L 50 50 C 50 65 70 75 70 90" fill="none" stroke="#2e2b44" stroke-width="12" stroke-linecap="round"/>
    <!-- Memory Foam Cushion -->
    <ellipse cx="20" cy="90" rx="18" ry="64" fill="#0b0b10" stroke="#1e1b2e" stroke-width="3"/>
    <!-- Outer Cup -->
    <ellipse cx="40" cy="90" rx="42" ry="68" fill="#14141e" stroke="#353150" stroke-width="3"/>
    <!-- LED Ambient Ring -->
    <ellipse cx="40" cy="90" rx="30" ry="52" fill="none" stroke="url(#purpleGlow2)" stroke-width="5" filter="url(#neon2)"/>
    <!-- Center Aluminum Disc -->
    <ellipse cx="40" cy="90" rx="20" ry="36" fill="#1e1b2e"/>
  </g>

  <!-- Text Badge -->
  <text x="400" y="440" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#c084fc" text-anchor="middle" letter-spacing="4" filter="url(#neon2)">AETHERIS // SPATIAL ANC</text>
</svg>
