<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e17"/>
      <stop offset="50%" stop-color="#141224"/>
      <stop offset="100%" stop-color="#08070d"/>
    </linearGradient>
    <linearGradient id="speakerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12121c"/>
      <stop offset="50%" stop-color="#222033"/>
      <stop offset="100%" stop-color="#100f1a"/>
    </linearGradient>
    <filter id="neon7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad7)"/>
  <circle cx="400" cy="300" r="180" fill="#8b5cf6" opacity="0.14" filter="url(#neon7)"/>

  <!-- Speaker Base Ground Shadow & Ambient Halo -->
  <ellipse cx="400" cy="485" rx="150" ry="20" fill="#000000" opacity="0.8"/>
  <ellipse cx="400" cy="480" rx="115" ry="14" fill="#a855f7" opacity="0.3" filter="url(#neon7)"/>

  <!-- Speaker Body Cylinder -->
  <path d="M 310 200 L 490 200 L 490 450 C 490 470 450 480 400 480 C 350 480 310 470 310 450 Z" fill="url(#speakerGrad)" stroke="#322e4d" stroke-width="4"/>

  <!-- Top Acoustic Radiator Cap -->
  <ellipse cx="400" cy="200" rx="90" ry="24" fill="#181726" stroke="#48426d" stroke-width="3"/>
  <ellipse cx="400" cy="200" rx="65" ry="16" fill="#0d0c15"/>
  <ellipse cx="400" cy="200" rx="45" ry="10" fill="#8b5cf6" opacity="0.7" filter="url(#neon7)"/>

  <!-- Perforated Grill Texture Lines -->
  <g stroke="#393557" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.7">
    <line x1="330" y1="260" x2="470" y2="260"/>
    <line x1="325" y1="290" x2="475" y2="290"/>
    <line x1="320" y1="320" x2="480" y2="320"/>
    <line x1="320" y1="350" x2="480" y2="350"/>
    <line x1="320" y1="380" x2="480" y2="380"/>
    <line x1="325" y1="410" x2="475" y2="410"/>
  </g>

  <!-- Downward LED Bass Ring -->
  <ellipse cx="400" cy="455" rx="88" ry="18" fill="none" stroke="#c084fc" stroke-width="6" filter="url(#neon7)"/>

  <text x="400" y="340" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="6">PULSAR // 360</text>
</svg>
