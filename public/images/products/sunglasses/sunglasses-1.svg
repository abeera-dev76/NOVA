<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e17"/>
      <stop offset="50%" stop-color="#141224"/>
      <stop offset="100%" stop-color="#08070d"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="neon6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad6)"/>
  <circle cx="400" cy="300" r="160" fill="#8b5cf6" opacity="0.16" filter="url(#neon6)"/>
  <ellipse cx="400" cy="440" rx="200" ry="16" fill="#000000" opacity="0.7"/>

  <!-- Left Temple Arm -->
  <path d="M 210 280 L 150 250" stroke="#2c2a3f" stroke-width="8" stroke-linecap="round"/>
  <!-- Right Temple Arm -->
  <path d="M 590 280 L 650 250" stroke="#2c2a3f" stroke-width="8" stroke-linecap="round"/>

  <!-- Browline Frame Bar -->
  <path d="M 200 270 L 600 270" stroke="#181824" stroke-width="12" stroke-linecap="round"/>
  <path d="M 200 270 L 600 270" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" filter="url(#neon6)"/>

  <!-- Left Polarized Lens -->
  <polygon points="210,285 370,285 350,380 230,370" fill="url(#lensGrad)" opacity="0.85" stroke="#37344d" stroke-width="4" filter="url(#neon6)"/>
  <!-- Left Lens Glare reflection -->
  <line x1="240" y1="295" x2="330" y2="355" stroke="#ffffff" stroke-width="3" opacity="0.5" stroke-linecap="round"/>

  <!-- Bridge -->
  <path d="M 370 290 Q 400 275 430 290" fill="none" stroke="#2c2a3f" stroke-width="10"/>

  <!-- Right Polarized Lens -->
  <polygon points="430,285 590,285 570,370 450,380" fill="url(#lensGrad)" opacity="0.85" stroke="#37344d" stroke-width="4" filter="url(#neon6)"/>
  <!-- Right Lens Glare reflection -->
  <line x1="460" y1="295" x2="550" y2="355" stroke="#ffffff" stroke-width="3" opacity="0.5" stroke-linecap="round"/>

  <text x="400" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#a855f7" text-anchor="middle" letter-spacing="5">OBSIDIAN // UV400</text>
</svg>
